version: '3.8'
services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8000:8000"
    env_file:
      - ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - docker-network

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
    
      - MONGO_URL=mongodb://mongo:27017/
    networks:
      - docker-network

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    networks:
      - docker-network

networks:
  docker-network: